name: Deploy test Mini App to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm ci
      - run: npm run verify:models
      - run: npm run test
      - run: npm run test:bot
      - name: Build for repository subpath
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test the GitHub Pages subpath
        env:
          E2E_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish test application
        id: deployment
        uses: actions/deploy-pages@v4
